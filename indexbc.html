<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Constructor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f0f0f;
        color: #ecf0f1;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #1a1a1a;
        border-bottom: 2px solid #34495e;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .title {
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 2px;
        color: #f39c12;
      }

      .toolbar {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .tool-group {
        display: flex;
        gap: 0.5rem;
        border-right: 1px solid #34495e;
        padding-right: 1rem;
      }

      button {
        padding: 0.5rem 1rem;
        background: #34495e;
        color: #ecf0f1;
        border: 2px solid #34495e;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font-size: 0.9rem;
      }

      button:hover {
        background: #455a64;
        border-color: #90caf9;
      }

      button:active {
        transform: scale(0.98);
      }

      button:focus {
        outline: 2px solid #f39c12;
        outline-offset: 2px;
      }

      button.active {
        background: #f39c12;
        color: #1a1a1a;
        border-color: #f39c12;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        display: flex;
        gap: 1rem;
        align-items: center;
        font-size: 0.9rem;
      }

      .cost-display {
        background: #2c3e50;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-family: 'Courier New', monospace;
      }

      .cost-display.warning {
        background: #c0392b;
        color: #fff;
      }

      .mute-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }

      #game-container {
        flex: 1;
        display: flex;
        position: relative;
      }

      canvas {
        display: block;
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .overlay.active {
        display: flex;
      }

      .overlay-content {
        background: #1a1a1a;
        border: 2px solid #34495e;
        border-radius: 8px;
        padding: 2rem;
        text-align: center;
        max-width: 400px;
      }

      .overlay-content h2 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #f39c12;
      }

      .overlay-content p {
        margin: 0.5rem 0;
        font-size: 1rem;
        line-height: 1.5;
      }

      .overlay-content .result-time {
        font-family: 'Courier New', monospace;
        font-size: 1.2rem;
        color: #90caf9;
        margin: 1rem 0;
      }

      .overlay-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.5rem;
      }

      .overlay-buttons button {
        min-width: 100px;
      }

      .help-text {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        font-size: 0.8rem;
        color: #7f8c8d;
        line-height: 1.4;
        max-width: 200px;
      }

      @media (max-width: 1024px) {
        .help-text {
          display: none;
        }

        .toolbar {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="title">🌉 Bridge Constructor</div>
        <div class="toolbar">
          <div class="tool-group">
            <button class="tool-btn" data-tool="deck" title="Road Deck (D)">Road</button>
            <button class="tool-btn" data-tool="steel" title="Steel Member (S)">Steel</button>
          </div>
          <div class="tool-group">
            <button id="undo-btn" title="Undo (Ctrl+Z)">↶ Undo</button>
            <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
          </div>
          <div class="tool-group">
            <button id="clear-btn" title="Clear Design (Ctrl+C)">Clear</button>
            <button id="reset-btn" title="Reset (Ctrl+R)">Reset</button>
          </div>
          <div class="status">
            <div class="cost-display" id="cost-display">$0 / $10,000</div>
            <button id="test-btn" title="Test Bridge (T)">▶ TEST</button>
            <button id="mute-btn" class="mute-btn" title="Toggle Mute (M)">🔊</button>
          </div>
        </div>
      </header>

      <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div class="overlay" id="success-overlay">
          <div class="overlay-content">
            <h2>🎉 Success!</h2>
            <p>Your bridge survived the truck!</p>
            <div class="result-time" id="success-time"></div>
            <p id="success-cost"></p>
            <div class="overlay-buttons">
              <button id="success-reset">Build Again</button>
            </div>
          </div>
        </div>

        <div class="overlay" id="failure-overlay">
          <div class="overlay-content">
            <h2>💥 Failure</h2>
            <p id="failure-reason"></p>
            <div class="result-time" id="failure-time"></div>
            <p id="failure-cost"></p>
            <div class="overlay-buttons">
              <button id="failure-reset">Try Again</button>
            </div>
          </div>
        </div>

        <div class="help-text">
          <strong>Controls:</strong><br />
          D - Road Deck<br />
          S - Steel Member<br />
          Ctrl+Z - Undo<br />
          Ctrl+Shift+Z - Redo<br />
          T - Test<br />
          Esc - Stop Test<br />
          M - Mute<br />
          Right-click to erase
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
